apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: flask-mongodb-app
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "flaskuser"
  MONGO_INITDB_ROOT_PASSWORD: "SuperStrongPassword123"
  # Authenticated MongoDB URI connecting via CoreDNS cluster service name
  # Note: authSource=admin is required because root users are created in the 'admin' database
  MONGODB_URI: "mongodb://flaskuser:SuperStrongPassword123@mongodb-service:27017/flask_db?authSource=admin"
