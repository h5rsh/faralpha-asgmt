apiVersion: v1
kind: Service
metadata:
  name: flask-service
  labels:
    app: flask-app
    app.kubernetes.io/name: flask-app
    app.kubernetes.io/part-of: flask-mongodb-app
spec:
  type: NodePort
  selector:
    app: flask-app
  ports:
    - name: http
      protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30007

